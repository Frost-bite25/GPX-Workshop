/* Layout: app shell. Header on top, track library on the left, map in the middle with a tool rail,
   elevation profile along the bottom. Tool panels float over the map's top-right corner. */
:root {
  --bg: #0a0b0a; --panel: #141614; --ink: #eceeea; --muted: #98a19a; --line: #2b312c;
  --accent: #c86bff; --accent-ink: #14091a; --ok: #4cc283; --warn: #ff7a70; --hover: #1f2420;
  --display: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --body: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #eef0ec; --panel: #ffffff; --ink: #1a1f1c; --muted: #5d665f; --line: #d3d8d1;
  --accent: #a400e0; --accent-ink: #ffffff; --ok: #1d7a45; --warn: #b3261e; --hover: #f1f3ef; color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.4; overflow: hidden; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 6px 10px; font-weight: 600; white-space: nowrap; }
button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
button .ic { flex: none; }
button:hover:not(:disabled) { background: var(--hover); }
button:disabled { opacity: .4; cursor: not-allowed; }
button.pri { background: var(--ink); color: var(--panel); border-color: var(--ink); }
button.pri:hover:not(:disabled) { background: var(--ink); opacity: .88; }
button.danger { color: var(--warn); }
button.on, button.on:hover:not(:disabled) { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
input[type=text], input[type=search], input[type=number], input[type=datetime-local], select, textarea {
  background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; min-width: 0; }
input[type=range] { width: 100%; accent-color: var(--accent); }
input[type=checkbox], input[type=radio] { accent-color: var(--accent); width: 16px; height: 16px; flex: none; }
label { display: block; }

#app { display: grid; height: 100%; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "top top" "side map" "side prof"; }

/* Header */
#top { grid-area: top; display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); overflow-x: auto; }
#top h1 { font-family: var(--display); font-size: 1.2rem; font-weight: 700; margin: 0 6px 0 2px; white-space: nowrap; letter-spacing: .01em; }
#top h1 span { color: var(--accent); }
#top h1 small { font-family: var(--body); font-size: .72rem; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 1px 7px; vertical-align: middle; letter-spacing: 0; }
#verNote { font-size: .72rem; }
#top .grp { display: flex; gap: 4px; }
#top .sp { flex: 1 1 auto; }
#search { display: flex; gap: 4px; flex: 0 1 300px; min-width: 150px; }

/* Library */
#side { grid-area: side; width: 310px; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }

#side .hd .row { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
#side .hd .row button { padding: 4px 8px; font-size: .85rem; }
#side .hd .cnt { font-size: .8rem; color: var(--muted); margin-left: auto; }
#list { flex: 1 1 auto; overflow-y: auto; min-height: 0; }
.folder { display: flex; align-items: center; gap: 6px; padding: 6px 10px; position: sticky; top: 0; z-index: 1; background: var(--bg); border-top: 1px solid var(--line); cursor: pointer; }
.folder .fname { flex: 1 1 auto; min-width: 0; font-family: var(--display); font-weight: 600; font-size: 1.05rem; letter-spacing: .02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.folder .chev { display: inline-block; width: 1em; color: var(--muted); }
.folder .fcount { margin-left: 8px; font-family: var(--body); font-size: .75rem; font-weight: 400; color: var(--muted); }
.folder.dragover, .frow.dragover { outline: 2px dashed var(--accent); outline-offset: -2px; }
.folder.edit { cursor: default; }
@media (hover: hover) { .folder .mini { display: none; } .folder:hover .mini, .folder:focus-within .mini { display: inline-flex; } }
.folder.sub { position: static; background: var(--panel); border-top-style: dashed; }
.folder:not(.sub) .fname { font-size: 1.1rem; font-weight: 600; }
.folder.sub .fname { font-size: .95rem; font-weight: 400; }
.folder[draggable="true"] { -webkit-user-drag: element; }
.segnote { display: grid; gap: 6px; margin: 8px; padding: 10px 12px; border: 1px solid color-mix(in srgb, var(--accent) 50%, var(--line)); border-radius: 10px; background: color-mix(in srgb, var(--accent) 10%, var(--panel)); font-size: .88rem; }
.segnote span { color: var(--muted); }
.segnote .row { display: flex; gap: 6px; flex-wrap: wrap; }
.segsplit { display: flex; align-items: center; gap: 8px; padding: 4px 8px 6px 6px; font-size: .8rem; color: var(--muted); }
.segsplit span { flex: 1; }
.segsplit button { padding: 3px 9px; font-size: .8rem; }
button.mini { padding: 3px 5px; border-color: transparent; background: transparent; color: var(--muted); }

input.inl { padding: 3px 6px; font-size: .92rem; flex: 1 1 auto; }
.frow.infolder { padding-left: 22px; }
#moveTo { flex: 1 1 130px; padding: 4px 6px; font-size: .85rem; }
.frow { display: grid; grid-template-columns: auto 12px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 6px 10px; border-top: 1px solid var(--line); cursor: pointer; }

.frow.hiddenfile .nm, .frow.hiddenfile .sub { opacity: .5; }
.frow .dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--line); }

.frow .sub { font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.frow .eye { padding: 2px 7px; font-size: .75rem; font-weight: 600; }
.empty { padding: 22px 14px; color: var(--muted); display: grid; gap: 10px; }
.empty b { color: var(--ink); font-family: var(--display); font-size: 1.2rem; }
#side .ft { border-top: 1px solid var(--line); padding: 8px 10px; display: grid; gap: 6px; font-size: .8rem; color: var(--muted); }
#side .ft .row { display: flex; gap: 4px; }
#btnTrash { justify-content: flex-start; }
.trashhd { padding: 12px 10px; display: grid; gap: 6px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: .85rem; }
.trashhd b { color: var(--ink); font-family: var(--display); font-size: 1.2rem; }
.trashhd .row, .trow .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.trashhd button, .trow button { padding: 3px 9px; font-size: .82rem; }
.frow.trow { grid-template-columns: 12px minmax(0, 1fr); cursor: default; align-items: start; }
.frow.trow .dot { margin-top: 5px; }
.frow.trow .sub { white-space: normal; }
#side .ft button { font-size: .82rem; padding: 4px 8px; flex: 1; }

/* Map */
#mapwrap { grid-area: map; position: relative; min-height: 0; min-width: 0; }
#map { position: absolute; inset: 0; z-index: 0; background: var(--bg); }
#rail { position: absolute; left: 30px; top: 8px; bottom: 8px; z-index: 800; display: flex; flex-direction: column; gap: 3px; overflow-y: auto; pointer-events: none; scrollbar-width: none; }
#rail button { pointer-events: auto; width: 58px; min-height: 42px; padding: 4px 2px 3px; border-radius: 9px; border-color: transparent; box-shadow: 0 1px 4px rgba(0,0,0,.35); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; flex: none; }
#rail button span { display: block; font-size: 10.5px; font-weight: 600; line-height: 1.1; letter-spacing: .01em; white-space: nowrap; }
#rail button .ic { width: 18px; height: 18px; color: var(--accent); }
#rail button.on .ic { color: inherit; }
#top button .ic { color: var(--accent); }
#top button.on .ic, #top button:disabled .ic { color: inherit; }
#btnGo span { display: none; }
#rail .sep { height: 8px; flex: none; }
.float { position: absolute; z-index: 900; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 4px 18px rgba(0,0,0,.28); max-height: calc(100% - 16px); overflow-y: auto; }
#panel { right: 8px; top: 8px; width: 300px; max-width: calc(100% - 16px); padding: 12px; display: grid; gap: 10px; }
#garminp { right: 8px; top: 8px; width: 360px; max-width: calc(100% - 16px); padding: 12px; display: grid; gap: 8px; z-index: 950; }
.gsteps { color: var(--muted); font-size: .88rem; margin: 0; padding-left: 20px; display: grid; gap: 3px; }
.grow { display: flex; align-items: center; gap: 10px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; }
.grow .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.grow .gtxt { flex: 1; min-width: 0; display: grid; gap: 1px; }
.grow .gtxt b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grow .gtxt span { font-size: .8rem; color: var(--muted); }
.grow .gtxt .warn { color: #ffb020; }
.grow button { flex: none; }
#sharep { right: 8px; top: 8px; width: 340px; max-width: calc(100% - 16px); padding: 12px; display: grid; gap: 8px; z-index: 950; }
.newlink { display: grid; gap: 6px; padding: 10px; border: 1px solid var(--accent); border-radius: 8px; }
.sharerow { display: grid; gap: 2px; padding: 8px 0; border-top: 1px solid var(--line); }
.sharerow .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sharerow .sub { font-size: .8rem; color: var(--muted); }
.sharerow .row { margin-top: 4px; }
.sharerow button, .sharerow .btnlink { padding: 3px 9px; font-size: .82rem; flex: 0 0 auto !important; }
a.btnlink { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-weight: 600; color: var(--ink); text-decoration: none; background: var(--panel); }
.edgetab { position: absolute; z-index: 820; border-color: var(--line); background: var(--panel); color: var(--ink); box-shadow: 0 1px 5px rgba(0,0,0,.4); font-size: .8rem; font-weight: 600; }
.edgetab .chev { font-size: 1rem; line-height: 1; color: var(--accent); }
#sideTab { left: 0; top: 50%; transform: translateY(-50%); width: 22px; height: 64px; padding: 0; border-left: 0; border-radius: 0 8px 8px 0; flex-direction: column; gap: 6px; }
#sideTab.shut { height: auto; padding: 10px 0; }
#sideTab .lbl { writing-mode: vertical-rl; transform: rotate(180deg); letter-spacing: .04em; }
#profTab { bottom: 0; left: 50%; transform: translateX(-50%); padding: 3px 14px; border-bottom: 0; border-radius: 8px 8px 0 0; gap: 6px; }
#syncp { right: 8px; top: 8px; width: 340px; max-width: calc(100% - 16px); padding: 12px; display: grid; gap: 8px; z-index: 950; }
.float p.bad { color: var(--warn); }
.float p.bad:empty { display: none; }
ol.steps { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; font-size: .88rem; color: var(--muted); }
ol.steps b { color: var(--ink); }
#btnSync { justify-content: flex-start; }
.float details { border-top: 1px solid var(--line); padding-top: 8px; }
.float summary { cursor: pointer; font-weight: 600; font-size: .9rem; }
.float details .inner { display: grid; gap: 8px; margin-top: 8px; }
#btnSync.warn { border-color: var(--warn); color: var(--warn); }
#layers { right: 8px; top: 8px; width: 280px; max-width: calc(100% - 16px); padding: 12px; display: grid; gap: 8px; z-index: 950; }
.float h2 { margin: 0; font-family: var(--display); font-size: 1.25rem; font-weight: 600; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.float h2 button { padding: 1px 8px; font-size: .85rem; }
.float h2 .ttl { display: inline-flex; align-items: center; gap: 8px; }
.float h2 .ttl .ic { width: 22px; height: 22px; color: var(--accent); }
.float h3 { margin: 6px 0 0; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.float p { margin: 0; color: var(--muted); font-size: .88rem; }
.float .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.float .row > button { flex: 1 1 auto; }
.fld { display: grid; gap: 3px; }
.fld > span { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.chk { display: flex; gap: 8px; align-items: center; font-size: .92rem; }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.swatches button { width: 28px; height: 28px; padding: 0; border-radius: 50%; border: 2px solid var(--line); }
.swatches button.on, .swatches button.on:hover:not(:disabled) { border-color: var(--ink); box-shadow: 0 0 0 2px var(--panel) inset; }
.big { font-family: var(--display); font-size: 1.3rem; font-weight: 600; font-variant-numeric: tabular-nums; }
#toast { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); z-index: 1000; background: var(--ink); color: var(--panel); padding: 8px 14px; border-radius: 8px; display: flex; gap: 12px; align-items: center; max-width: calc(100% - 24px); font-size: .92rem; box-shadow: 0 4px 14px rgba(0,0,0,.3); }
#toast button { background: transparent; color: inherit; border-color: currentColor; padding: 2px 9px; }
#status { position: absolute; right: 56px; bottom: 22px; z-index: 700; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; font-family: var(--mono); font-size: .72rem; color: var(--muted); pointer-events: none; }
#status:empty { display: none; }
/* Segments under a track */
.fgroup { border-top: 1px solid var(--line); }
.fgroup > .frow { border-top: 0; }
.segs { display: grid; padding: 0 0 6px 34px; }
.frow.infolder + .segs, .fgroup .frow.infolder ~ .segs { padding-left: 46px; }
.segrow { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 5px 8px 5px 6px; border-left: 2px solid var(--line); cursor: pointer; border-radius: 0 6px 6px 0; }
.segrow:hover { background: var(--hover); }
.segrow.on { border-left-color: #ffd400; background: var(--hover); }
.segrow .segmark { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: .72rem; font-weight: 700; background: var(--bg); border: 1px solid var(--line); color: var(--muted); }
.segrow.on .segmark { background: #ffd400; color: #1a1f1c; border-color: #ffd400; }
.segrow .nm { font-weight: 600; font-size: .9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.segrow .sub { font-size: .76rem; color: var(--muted); font-variant-numeric: tabular-nums; }
button.segtog { display: inline-flex; gap: 3px; margin-left: 6px; padding: 0 6px; font-size: .74rem; font-weight: 600; border-radius: 99px; background: var(--bg); color: var(--ink); vertical-align: 1px; }
button.segtog.open { border-color: #ffd400; }
button.segtog .chev { color: #ffd400; }
.guestbadge { display: inline-flex; gap: 5px; padding: 3px 10px; border-radius: 99px; background: #ffd400; color: #1a1f1c; border-color: #ffd400; font-size: .82rem; }
.guestbadge .ic { width: 15px; height: 15px; color: #1a1f1c !important; }
.guestopt { display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 12px; margin-top: 4px; }
.guestopt > span { font-size: .85rem; color: var(--muted); }
html.guest #btnSync { border-color: #ffd400; }
#expmenu { width: 250px; padding: 4px; display: grid; gap: 2px; z-index: 1000; }
#expmenu button { display: grid; justify-items: start; gap: 1px; border: 0; text-align: left; padding: 7px 10px; }
#expmenu button span { font-weight: 400; font-size: .8rem; color: var(--muted); white-space: normal; }
#view3d { position: absolute; inset: 0; z-index: 940; background: var(--bg); }
#map3d { position: absolute; inset: 0; }
#ctl3d { right: 8px; top: 8px; width: 270px; max-width: calc(100% - 16px); padding: 12px; display: grid; gap: 8px; }
.ttl3d { display: flex; align-items: center; gap: 8px; }
.ttl3d .ic { color: var(--accent); width: 20px; height: 20px; }
.ttl3d b { flex: 1; font-size: 1.1rem; }
.ttl3d button { padding: 3px 9px; font-size: .82rem; }
.wpt3d { display: inline-flex; flex-direction: column; align-items: center; pointer-events: none; }
.wpt3d i { font-style: normal; background: #1a1f1c; color: #fff; border: 2px solid #fff; border-radius: 6px; padding: 0 5px; font: 600 11px/16px var(--body); box-shadow: 0 1px 4px rgba(0,0,0,.5); white-space: nowrap; }
.wpt3d::after { content: ""; width: 2px; height: 10px; background: #fff; box-shadow: 0 0 2px #000; }
.maplibregl-ctrl-group { background: var(--panel) !important; } .maplibregl-ctrl-group button + button { border-top-color: var(--line) !important; }
.maplibregl-ctrl-group button .maplibregl-ctrl-icon { filter: invert(1); }
:root[data-theme="light"] .maplibregl-ctrl-group button .maplibregl-ctrl-icon { filter: none; }
#busy { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); z-index: 1000; background: var(--accent); color: var(--accent-ink); padding: 4px 12px; border-radius: 99px; font-weight: 600; font-size: .85rem; }
#ctx { position: absolute; z-index: 1100; padding: 4px; display: grid; gap: 2px; min-width: 190px; }
#ctx button { border: 0; justify-content: flex-start; font-weight: 400; }
#drop { position: absolute; inset: 0; z-index: 1200; background: color-mix(in srgb, var(--accent) 22%, transparent); border: 4px dashed var(--accent); display: grid; place-items: center; font-family: var(--display); font-size: 2rem; font-weight: 700; color: var(--ink); pointer-events: none; }

/* Profile */
#prof { grid-area: prof; background: var(--panel); border-top: 1px solid var(--line); min-width: 0; }
#prof.closed { border-top: 0; }
#prof.closed #chartwrap { display: none; }
#stats { display: flex; gap: 16px; padding: 5px 10px; overflow-x: auto; align-items: baseline; font-variant-numeric: tabular-nums; }
#stats .st { white-space: nowrap; }
#stats .st span { font-size: .68rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-right: 5px; }
#stats .st b { font-family: var(--display); font-size: 1.15rem; font-weight: 600; }
#stats .ttl { font-weight: 600; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#stats button { margin-left: auto; padding: 1px 8px; font-size: .78rem; }
#chartwrap { position: relative; height: 130px; }
#chart { width: 100%; height: 100%; display: block; touch-action: none; }
#chartmsg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--muted); font-size: .9rem; }

/* Lock screen */
#lock { position: fixed; inset: 0; z-index: 5000; background: var(--bg); display: grid; place-items: center; overflow-y: auto; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); }
.lockcard { width: min(380px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 24px; display: grid; gap: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.45); }
.lockcard img { border-radius: 14px; }
.lockcard h1 { margin: 0; font-family: var(--display); font-size: 2rem; font-weight: 700; line-height: 1; }
.lockcard h1 span { color: var(--accent); }
#lockBody { display: grid; gap: 10px; }
#lockBody p { margin: 0; color: var(--muted); font-size: .92rem; }
#lockBody p.bad { color: var(--warn); } #lockBody p.bad:empty { display: none; }
#lockBody button.pri { padding: 10px; }
#lock details { border-top: 1px solid var(--line); padding-top: 8px; }
#lock summary { cursor: pointer; font-weight: 600; font-size: .9rem; }
#lock details .inner { display: grid; gap: 8px; margin-top: 8px; }
.keyrow { display: grid; gap: 4px; }
.loginlist { display: grid; border: 1px solid var(--line); border-radius: 8px; }
.loginrow { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-top: 1px solid var(--line); }
.loginrow:first-child { border-top: 0; }
.loginrow > span { flex: 1 1 auto; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; min-width: 0; }
.loginrow > span .ic { color: var(--accent); width: 16px; height: 16px; }
.loginrow small { color: var(--muted); }
.loginrow button { padding: 2px 8px; font-size: .8rem; }
.float .inner[hidden] { display: none; }
.float .inner { display: grid; gap: 8px; }
.keyhd { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: .85rem; }
.keyhd span { color: var(--muted); flex: 1 1 auto; }
.keyhd a { color: var(--accent); font-weight: 600; }

/* Leaflet bits */
.leaflet-bar a, .leaflet-bar a:hover { background: var(--panel); color: var(--ink); border-bottom-color: var(--line); }
.leaflet-bar a.leaflet-disabled { background: var(--bg); color: var(--muted); }
.leaflet-bar { border-color: var(--line) !important; }
.leaflet-control-scale-line { background: color-mix(in srgb, var(--panel) 80%, transparent); color: var(--ink); border-color: var(--ink); text-shadow: none; }
.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel); color: var(--ink); }
.leaflet-container .leaflet-control-attribution { background: color-mix(in srgb, var(--panel) 75%, transparent); color: var(--muted); }
.leaflet-container .leaflet-control-attribution a { color: var(--ink); }
.leaflet-container { font-family: var(--body); }
.leaflet-control-attribution { font-size: 10px; }
.leaflet-overlay-blend { mix-blend-mode: multiply; }
.anc { width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 3px solid #1a1f1c; box-shadow: 0 0 0 1px #fff, 0 1px 4px rgba(0,0,0,.5); }
.anc.start { border-color: #1d7a45; } .anc.end { border-color: #b3261e; }
.wpt { transform: translate(-50%, -100%); display: inline-flex; flex-direction: column; align-items: center; white-space: nowrap; }
.wpt i { font-style: normal; background: #1a1f1c; color: #fff; border: 2px solid #fff; border-radius: 6px; padding: 0 5px; font: 600 11px/16px var(--body); box-shadow: 0 1px 4px rgba(0,0,0,.5); max-width: 160px; overflow: hidden; text-overflow: ellipsis; }
.wpt::after { content: ""; width: 2px; height: 8px; background: #fff; box-shadow: 0 0 2px #000; }
.kmk { transform: translate(-50%, -50%); background: #fff; color: #1a1f1c; border: 1.5px solid #1a1f1c; border-radius: 99px; padding: 0 5px; font: 600 10px/14px var(--body); white-space: nowrap; display: inline-block; }
.kmk.range { background: #ffd400; border-color: #1a1f1c; font-size: 11px; line-height: 16px; }
.arw { width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 11px solid #fff; filter: drop-shadow(0 0 1.5px #000); transform-origin: 50% 50%; }
.selbox { position: absolute; z-index: 850; border: 2px dashed var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); pointer-events: none; }

@media (max-width: 900px) {
  #btnUndo span, #btnRedo span, #btnLocate span, #btnShare span, #btnExport span, #btn3d .ic { display: none; }
  #app { grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "map" "prof"; }
  #side { position: fixed; z-index: 1300; left: 0; top: 46px; bottom: 0; width: min(320px, 88vw); box-shadow: 4px 0 20px rgba(0,0,0,.3); }
  #top h1 { display: none; }
  #chartwrap { height: 96px; }
  #panel, #layers { width: min(300px, calc(100% - 16px)); }
}

/* ---------- Phones only (PC and iPad layouts are not affected) ---------- */
@media (max-width: 640px), (max-height: 500px) and (pointer: coarse) {
  input, select, textarea { font-size: 16px; }   /* stops iPhone zooming in when you tap a box */
  #app { height: 100dvh; }
  /* Header: icon buttons on the first row, search + Locate + Maps on the second */
  #top { flex-wrap: wrap; overflow: visible; gap: 6px; padding: 6px 8px; padding-top: max(6px, env(safe-area-inset-top)); }
  #top .sp { display: none; }
  #top button { min-width: 38px; height: 38px; padding: 0 8px; justify-content: center; }
  #top button span { display: none; }
  #top #btn3d span { display: inline; font-weight: 700; } #top #btn3d .ic { display: none; }
  #search { order: 5; flex: 1 1 180px; display: flex; min-width: 0; }
  #search input { flex: 1; min-width: 0; height: 38px; }
  #btnLocate { order: 6; } #btnLayers { order: 7; }
  /* Library opens as a drawer under the header; tap the map to close it */
  #app { grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "map" "prof"; }
  #side { position: fixed; z-index: 1300; left: 0; bottom: 0; top: var(--toph, 46px); width: min(340px, 90vw); box-shadow: 4px 0 20px rgba(0,0,0,.3); }
  #top h1 { display: none; }
  #app:has(#side:not(.closed)) #mapwrap::after { content: ""; position: absolute; inset: 0; z-index: 1250; background: rgba(0,0,0,.45); }
  .frow { padding: 10px; } .segrow { padding: 9px 8px 9px 6px; }
  #side .hd button, #side .ft button, #side select { min-height: 38px; }
  #sideTab { display: none; }
  /* Tools become a toolbar along the bottom of the map; swipe it sideways */
  #rail { left: 0; right: 0; top: auto; bottom: 0; flex-direction: row; gap: 4px; padding: 5px 6px; overflow-x: auto; overflow-y: hidden; pointer-events: auto; background: var(--panel); border-top: 1px solid var(--line); scroll-snap-type: x proximity; }
  #rail button { width: 60px; min-height: 48px; box-shadow: none; border-color: var(--line); scroll-snap-align: start; }
  #rail .sep { width: 1px; height: auto; margin: 4px 2px; background: var(--line); }
  #map .leaflet-bottom { bottom: 60px; }
  #map .leaflet-control-zoom { display: none; }   /* pinch to zoom instead */
  #map .leaflet-control-attribution { font-size: 9px; max-width: 70vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #profTab { bottom: 60px; left: 8px; transform: none; }
  #toast { bottom: 96px; }
  #mapwrap:has(#panel:not([hidden]), #layers:not([hidden]), #syncp:not([hidden]), #sharep:not([hidden]), #garminp:not([hidden])) #toast { bottom: auto; top: 10px; } #status { bottom: 92px; right: 8px; }
  /* Panels slide up from the bottom, full width */
  #panel, #layers, #syncp, #sharep, #garminp { left: 0; right: 0; top: auto; bottom: 0; width: auto; max-width: none; border-radius: 14px 14px 0 0; border-bottom: 0; }
  #panel { max-height: 48%; } #layers, #syncp, #sharep, #garminp { max-height: 78%; }
  #panel::before, #layers::before, #syncp::before, #sharep::before, #garminp::before, #ctl3d::before { content: ""; justify-self: center; width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin-bottom: 2px; }
  #expmenu { left: 8px !important; right: 8px; width: auto; }
  #ctl3d { left: 0; right: 0; top: auto; bottom: 0; width: auto; max-width: none; max-height: 46%; border-radius: 14px 14px 0 0; border-bottom: 0; }
  /* Profile: smaller numbers and chart, clear of the iPhone home bar */
  #prof { padding-bottom: env(safe-area-inset-bottom); }
  #stats { gap: 12px; padding: 4px 8px; }
  #stats .st b { font-size: 1rem; }
  #stats .ttl { max-width: 120px; }
  #chartwrap { height: 82px; }
}
@media (max-width: 370px) { #top, #top .grp { gap: 4px; } #top button { min-width: 34px; height: 36px; padding: 0 6px; } #search input { height: 36px; } }
@media (max-height: 500px) and (pointer: coarse) { #chartwrap { display: none; } #profTab { display: none; } #panel { max-height: 70%; } #rail button { min-height: 42px; } }

</style>
</head>
<body>
<div id="app">
  <header id="top">
    <button id="sideToggle" title="Show or hide the track library">Library</button>
    <h1>GPX <span>Workshop</span> <small id="ver" title="Version 11.2, built 13 Nov 2026">v11.2</small></h1>
    <button id="guestBadge" class="guestbadge" title="You are using the app as a guest" hidden>Guest</button>
    <div class="grp">
      <button id="btnNew" title="Start a new empty route">New</button>
      <button id="btnImport" title="Import GPX files or a backup zip">Import</button>
      <button id="btnExport" title="Export the selected tracks as GPX">Export</button>
      <button id="btnShare" title="Share the selected tracks with a link">Share</button>
      <button id="btn3d" title="View the map in 3D, with terrain">3D</button>
    </div>
    <div class="grp">
      <button id="btnUndo" title="Undo (Ctrl+Z)" disabled>Undo</button>
      <button id="btnRedo" title="Redo (Ctrl+Y)" disabled>Redo</button>
    </div>
    <span class="sp"></span>
    <form id="search" role="search">
      <input id="q" type="search" placeholder="Place, or lat, lon" aria-label="Search for a place or coordinates" autocomplete="off">
      <button type="submit" id="btnGo" title="Search">Go</button>
    </form>
    <button id="btnLocate" title="Show my location">Locate</button>
    <button id="btnLayers" title="Base maps and overlays">Maps</button>
    <input id="fileIn" type="file" multiple accept=".gpx,.zip,application/gpx+xml,application/zip,text/xml,application/xml" hidden>
  </header>

  <aside id="side" aria-label="Track library">
    <div class="hd">
      <input id="filter" type="search" placeholder="Filter tracks" aria-label="Filter tracks by name or folder" autocomplete="off">
      <div class="row">
        <label class="chk" title="Select all"><input id="selAll" type="checkbox" aria-label="Select all tracks"></label>
        <button id="bZoom" disabled>Zoom to</button>
        <button id="bVis" disabled>Show/Hide</button>
        <button id="bDup" disabled>Duplicate</button>
        <button id="bRename" title="Rename the selected track (F2)" disabled>Rename</button>
        <button id="bDel" class="danger" disabled>Delete</button>
      </div>
      <div class="row">
        <select id="moveTo" aria-label="Move the selected tracks to a folder" disabled></select>
        <button id="bNewFolder" title="Create a folder">New folder</button>
        <span class="cnt" id="selCount"></span>
      </div>
    </div>
    <div id="list"></div>
    <div class="ft">
      <span id="storeNote">Tracks are saved in this browser on this device.</span>
      <span id="verNote">GPX Workshop version 11.2 · 13 Nov 2026</span>
      <button id="btnSync" title="Keep your tracks in a private GitHub repository">Cloud sync</button>
      <button id="btnTrash" title="Tracks you deleted in the last 90 days">Recently deleted</button>
      <div class="row">
        <button id="btnBackup" title="Download every track as one zip">Back up all</button>
        <button id="btnShowAll">Show all</button>
        <button id="btnHideAll">Hide all</button>
      </div>
    </div>
  </aside>

  <main id="mapwrap">
    <div id="map"></div>
    <nav id="rail" aria-label="Tools"></nav>
    <section id="panel" class="float" hidden aria-live="polite"></section>
    <section id="layers" class="float" hidden></section>
    <section id="syncp" class="float" hidden></section>
    <section id="sharep" class="float" hidden></section>
    <div id="expmenu" class="float" hidden></div>
    <section id="garminp" class="float" hidden></section>
    <div id="view3d" hidden><div id="map3d"></div><section id="ctl3d" class="float"></section></div>
    <button id="sideTab" class="edgetab" title="Show or hide the library" aria-label="Show or hide the library"></button>
    <button id="profTab" class="edgetab" title="Show or hide the elevation profile" aria-label="Show or hide the elevation profile"></button>
    <div id="ctx" class="float" hidden></div>
    <div id="busy" hidden></div>
    <div id="toast" hidden role="status"></div>
    <div id="status"></div>
    <div id="drop" hidden>Drop GPX files to import</div>
  </main>

  <footer id="prof">
    <div id="stats"></div>
    <div id="chartwrap">
      <canvas id="chart" aria-label="Elevation profile"></canvas>
      <div id="chartmsg" hidden></div>
    </div>
  </footer>
</div>

// Any track that leaves the library (deleted, or used up by Join or Extract) is kept here for 30 days.
const TRASH_DAYS = 90;
const Trash = {
  add(f) {
    if (!f || (!f.wpts.length && !f.segs.some(sg => sg.pts.length))) return;
    const rec = { id: f.id, file: f, deletedAt: Date.now() };
    S.trash = S.trash.filter(t => t.id !== f.id); S.trash.push(rec); DB.put(rec, 'trash'); Sync.poke();
  },
  remove(id) { if (!S.trash.some(t => t.id === id)) return; S.trash = S.trash.filter(t => t.id !== id); DB.del(id, 'trash'); Sync.poke(); },
  restore(ids) {
    const recs = S.trash.filter(t => ids.includes(t.id)); if (!recs.length) return;
    for (const r of recs) this.remove(r.id);
    op(`Restore ${recs.length} track${recs.length > 1 ? 's' : ''}`, [], () => { for (const r of recs) { if (fileById(r.file.id)) r.file.id = uid(); r.file.visible = true; S.files.push(r.file); } }, { trashOnUndo: true });
    select(recs.map(r => r.file.id), { active: recs[0].file.id }); zoomTo(recs.map(r => r.file));
  },
  purge() { const cut = Date.now() - TRASH_DAYS * 864e5; for (const t of S.trash.filter(x => x.deletedAt < cut)) this.remove(t.id); }
};

function op(label, ids, fn, opts) {

  S.undo.push({ label, before, trashOnUndo: !!(opts && opts.trashOnUndo) }); if (S.undo.length > 60) S.undo.shift(); S.redo.length = 0;

function applySnap(map, keepRemoved) {

// ---------- Shared geometry edits ----------
function flatCount(f) { let n = 0; for (const s of f.segs) n += s.pts.length; return n; }

    left.forEach((s, i) => { const ds = dist(e, s.pts[0]), de = dist(e, s.pts[s.pts.length - 1]); if (ds < bd) { bd = ds; bi = i; rev = false; } if (de < bd) { bd = de; bi = i; rev = true; } });

// ---------- Routing ----------
async function route(a, b) {
  const straight = [[b[0], b[1], null, null]];
  if (!S.set.routing) return straight;
  const prof = PROFILES.find(p => p.id === S.set.profile) || PROFILES[0];
  for (const id of [prof.id, prof.fallback].filter(Boolean)) {
    try {
      busy('Finding the route…');
      const r = await fetch(`https://brouter.de/brouter?lonlats=${a[1]},${a[0]}|${b[1]},${b[0]}&profile=${id}&alternativeidx=0&format=geojson`);
      if (!r.ok) continue;
      const c = (await r.json()).features[0].geometry.coordinates, out = c.slice(1).map(q => [q[1], q[0], q.length > 2 ? q[2] : null, null]);
      if (out.length) return out;

}

  const anc = ensureAnchors(seg), b = map.getBounds().pad(0.15); let shown = 0;
  anc.forEach((pi, k) => {

}
function drawTarget() { const f = activeFile(); if (!f) return null; if (!f.segs.length) f.segs.push(mkSeg('', [])); if (S.seg >= f.segs.length) S.seg = f.segs.length - 1; return { f, seg: f.segs[S.seg] }; }
async function appendPoint(ll) {

  const n0 = f.segs[si].pts.length, add = n0 ? await route(f.segs[si].pts[n0 - 1], P) : [P];
  const g = fileById(f.id); if (!g || !g.segs[si] || g.segs[si].pts.length !== n0) return;

// ---------- Elevation from terrain data ----------
async function fetchElevation(files) {
  let done = 0, total = 0; const plans = [];
  for (const f of files) for (const s of f.segs) {
    const idx = []; let acc = Infinity;
    for (let i = 0; i < s.pts.length; i++) { if (i > 0) acc += dist(s.pts[i - 1], s.pts[i]); if (acc >= 25 || i === s.pts.length - 1) { idx.push(i); acc = 0; } }
    plans.push({ f, s, idx, ele: [] }); total += idx.length;
  }
  if (!total) return;
  try {
    for (const pl of plans) for (let i = 0; i < pl.idx.length; i += 100) {
      const part = pl.idx.slice(i, i + 100).map(k => pl.s.pts[k]);
      busy(`Getting elevation… ${Math.round(done / total * 100)}%`);
      const r = await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${part.map(p => p[0].toFixed(5)).join(',')}&longitude=${part.map(p => p[1].toFixed(5)).join(',')}`);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const e = (await r.json()).elevation; if (!Array.isArray(e) || e.length !== part.length) throw new Error('bad reply');
      pl.ele.push(...e); done += part.length; await new Promise(res => setTimeout(res, 120));
    }
  } catch (err) { busy(''); toast("Couldn't get elevation data (" + err.message + '). Check your connection and try again. Nothing was changed.'); return; }
  busy('');
  op('Get elevation', files.map(f => f.id), () => {
    for (const pl of plans) {
      const pts = pl.s.pts;
      for (let j = 0; j < pl.idx.length; j++) {
        const a = pl.idx[j], b = pl.idx[j + 1]; pts[a][2] = pl.ele[j]; if (b == null) break;
        let span = 0; for (let i = a + 1; i <= b; i++) span += dist(pts[i - 1], pts[i]);
        let run = 0; for (let i = a + 1; i < b; i++) { run += dist(pts[i - 1], pts[i]); pts[i][2] = pl.ele[j] + (pl.ele[j + 1] - pl.ele[j]) * (span ? run / span : 0); }
      }
    }
  });
  toast('Elevation added from terrain data (about 90 m grid).');
}

// ============================================================================
// Cloud sync: keeps the library and Recently deleted in a private GitHub repository.
//   tracks/<id>.json   one file per track
//   trash/<id>.json    one file per recently deleted track
// The token and repository name are stored in this browser only.
// For each track the app remembers the version it last synced, so it can tell
// "changed here", "changed on another device" and "changed on both" apart.
// ============================================================================
const Sync = {
  cfg: null, state: { files: {}, trash: {} }, busy: false, pending: false, internal: false, timer: 0, last: 0, err: '', msg: '', isPrivate: true, branch: 'main',

  load() {
    if (GUEST) { this.cfg = null; this.state = { files: {}, trash: {} }; this.last = 0; return; }   // a guest never uses your sign-in
    try { this.cfg = JSON.parse(localStorage.getItem('gpxw-sync') || 'null'); this.state = JSON.parse(localStorage.getItem('gpxw-syncstate') || 'null') || { files: {}, trash: {} }; this.last = +localStorage.getItem('gpxw-synclast') || 0; }
    catch { this.cfg = null; this.state = { files: {}, trash: {} }; }
  },
  saveState() { try { localStorage.setItem('gpxw-syncstate', JSON.stringify(this.state)); } catch { /* ignore */ } },
  on() { return !!(this.cfg && this.cfg.repo && this.cfg.token); },

  async api(method, path, body, raw) {
    const headers = { Authorization: 'Bearer ' + this.cfg.token, Accept: raw ? 'application/vnd.github.raw+json' : 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
    if (body) headers['Content-Type'] = 'application/json';
    const r = await fetch('https://api.github.com/repos/' + this.cfg.repo + path, { method, headers, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' });
    if (!r.ok) { const e = new Error('GitHub ' + r.status); e.status = r.status; throw e; }
    return raw ? r.text() : (r.status === 204 ? null : r.json());
  },
  explain(e) {
    if (e.status === 401) return 'GitHub rejected the token. Create a new token and connect again.';
    if (e.status === 403) return "The token isn't allowed to do this. It needs the permission Contents: Read and write on this repository.";
    if (e.status === 404) return "GitHub can't find that repository with this token. Check the name (owner/repository) and that the token covers it.";
    if (e.status === 409 || e.status === 422) return 'GitHub was busy with another change. Sync will try again shortly.';
    if (e.status) return 'GitHub returned an error (' + e.status + '). Sync will try again later.';
    return 'No connection to GitHub. Sync will try again when you are online.';
  },
  b64(text) { const u = new TextEncoder().encode(text); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); },
  ser(f) { const c = cloneFile(f); delete c.visible; return c; },
  same(a, b) { const x = this.ser(a), y = this.ser(b); delete x.modified; delete y.modified; return JSON.stringify(x) === JSON.stringify(y); },
  async put(path, obj, sha, message) { const r = await this.api('PUT', '/contents/' + path, Object.assign({ message, content: this.b64(JSON.stringify(obj)) }, sha ? { sha } : {})); return r.content.sha; },
  del(path, sha, message) { return this.api('DELETE', '/contents/' + path, { message, sha }); },
  async get(path) { return JSON.parse(await this.api('GET', '/contents/' + path + '?ref=' + encodeURIComponent(this.branch), null, true)); },
  async listRemote() {

// ============================================================================
// Share links: the selected tracks go into a secret GitHub Gist; the link opens a read-only
// viewer on this site (?s=<gist id>). Links can have an end date and can be deleted at any time.
// ============================================================================
const SHARE_FILE = 'gpx-workshop-share.json';

  list() { return Array.isArray(S.set.shares) ? S.set.shares : []; },
  url(id) { return location.origin + location.pathname + '?s=' + id; },
  headers() { return { Authorization: 'Bearer ' + Sync.cfg.token, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json' }; },
  explain(status) {
    if (status === 401) return 'GitHub rejected the token. Create a new token and sign in again.';
    if (status === 403 || status === 404) return "Your token isn't allowed to create share links. On GitHub, edit the token and set Account permissions → Gists: Read and write, then try again.";
    if (status === 422) return 'GitHub refused the upload. The selected tracks may be too large for one link; try fewer tracks.';
    if (status) return 'GitHub returned an error (' + status + '). Try again shortly.';
    return 'No connection to GitHub. Check your internet connection and try again.';
  },
  async create(files, days, allowDownload) {
    const expires = days ? Date.now() + days * 864e5 : null, data = viewerData(files, { expires, allowDownload });
    let r; try { r = await fetch('https://api.github.com/gists', { method: 'POST', headers: this.headers(), body: JSON.stringify({ description: 'GPX Workshop shared link: ' + data.title, public: false, files: { [SHARE_FILE]: { content: JSON.stringify(data) } } }) }); }

    if (!r.ok) throw new Error(this.explain(r.status));
    const j = await r.json(), rec = { id: j.id, title: data.title, created: Date.now(), expires, tracks: files.length, download: allowDownload !== false };
    S.set.shares = this.list().concat([rec]); cfgTouched(); return rec;
  },
  async remove(id) {   // deletes the gist; a gist that is already gone counts as deleted
    let r; try { r = await fetch('https://api.github.com/gists/' + id, { method: 'DELETE', headers: this.headers() }); } catch { throw new Error(this.explain(0)); }
    if (!r.ok && r.status !== 404) throw new Error(this.explain(r.status));
    S.set.shares = this.list().filter(x => x.id !== id); cfgTouched();
  },
  running: false,
  async cleanup() {    // deletes links whose end date has passed
    if (this.running || !Sync.on()) return; this.running = true;
    try { for (const x of this.list().filter(x => x.expires && x.expires < Date.now())) { try { await this.remove(x.id); } catch (e) { console.warn('share cleanup', e); break; } } }
    finally { this.running = false; if (!$('sharep').hidden) this.panel(); }
  },
  async send(rec) {    // share sheet where available (iPad, phones), otherwise copy
    const url = this.url(rec.id);
    if (navigator.share) { try { await navigator.share({ title: rec.title, text: rec.title + ' (GPX track)', url }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
    try { await navigator.clipboard.writeText(url); toast('Link copied. Paste it into WhatsApp or an email.'); } catch { toast(url); }
  },
  last: null, opts: { days: 30, download: true },
  panel() {
    const p = $('sharep'); if (p.querySelector('input:focus, select:focus')) return;
    p.textContent = ''; const files = selFiles().filter(f => f.segs.some(s => s.pts.length) || f.wpts.length);
    p.append(h('h2', {}, h('span', { class: 'ttl' }, icon('share'), 'Share'), h('button', { text: 'Close', onclick: () => { p.hidden = true; } })));
    if (!files.length) p.append(h('p', { text: 'Select one or more tracks in the library to share them.' }));
    else {
      p.append(h('p', {}, h('b', { text: files.length === 1 ? files[0].name : files.length + ' tracks' }), files.length > 1 ? ': ' + files.map(f => f.name).join(', ') : ''));
      const days = h('select', { onchange: e => { this.opts.days = +e.target.value; } }, [[1, '1 day'], [7, '7 days'], [30, '30 days'], [90, '90 days'], [0, 'No end date']].map(([v, t]) => h('option', { value: v, selected: this.opts.days === v, text: t })));
      const out = h('p', { class: 'bad' });
      const make = h('button', { class: 'pri', text: 'Create link', disabled: !Sync.on(), onclick: async () => {
        make.disabled = true; out.className = ''; out.textContent = 'Creating link…';
        try { this.last = await this.create(files, this.opts.days, this.opts.download); this.panel(); this.send(this.last); }
        catch (e) { out.className = 'bad'; out.textContent = e.message; make.disabled = false; }
      } });
      p.append(...[fld('Link stays live for', days),
        h('label', { class: 'chk' }, h('input', { type: 'checkbox', checked: this.opts.download, onchange: e => { this.opts.download = e.target.checked; } }), 'Allow people to download the GPX'),
        Sync.on() ? null : h('p', { text: GUEST ? 'Share links need a login. As a guest you can use Save as file.' : 'Share links need Cloud sync. Sign in under Cloud sync first.' }), out,
        h('div', { class: 'row' }, make, h('button', { text: 'Save as file', title: 'Save a web page file instead of a link', onclick: () => saveSharePage(files) }))].filter(Boolean));
    }
    if (this.last && this.list().some(x => x.id === this.last.id)) {
      const u = this.url(this.last.id), box = h('input', { type: 'text', value: u, readOnly: true, onfocus: e => e.target.select() });
      p.append(h('div', { class: 'newlink' }, h('b', { text: 'Link ready' }), box, h('div', { class: 'row' }, h('button', { class: 'pri', text: navigator.share ? 'Send…' : 'Copy link', onclick: () => this.send(this.last) }), h('a', { href: u, target: '_blank', rel: 'noopener', class: 'btnlink', text: 'Open' }))));
    }
    const list = this.list().slice().sort((a, b) => b.created - a.created);
    p.append(h('h3', { text: 'Your shared links' }));
    if (!list.length) p.append(h('p', { text: 'Links you create show here, so you can copy them again or stop sharing.' }));

        h('div', { class: 'nm', text: x.title }),
        h('div', { class: 'sub', text: 'Made ' + fmtDay(x.created) + ' · ' + (ended ? 'ended' : x.expires ? 'ends ' + fmtDay(x.expires) : 'no end date') + (x.download === false ? ' · no download' : '') }),
        h('div', { class: 'row' },
          ended ? null : h('button', { text: navigator.share ? 'Send' : 'Copy', onclick: () => this.send(x) }),
          ended ? null : h('a', { href: this.url(x.id), target: '_blank', rel: 'noopener', class: 'btnlink', text: 'Open' }),
          Sync.on() ? confirmBtn('Stop sharing', async () => { try { await this.remove(x.id); toast('Link deleted. It no longer opens.'); } catch (e) { toast(e.message); } this.panel(); }) : null)));
    }
  }
};

// ---- The page that opens a share link (?s=<id>). Replaces the app on this visit only.
async function openSharedView(id) {
  document.querySelectorAll('style').forEach(st => st.remove());
  const st = document.createElement('style'); st.textContent = VIEWER_CSS; document.head.append(st);
  document.documentElement.removeAttribute('data-theme');
  const gone = (head, text) => { document.body.innerHTML = ''; document.body.append(h('div', { id: 'gone', style: 'grid-row: 1 / -1' }, h('div', {}, h('b', { text: head }), text))); };
  if (!/^[0-9a-f]{20,40}$/i.test(id)) { gone('This link is not valid', 'Check that the whole link was copied.'); return; }
  document.body.innerHTML = ''; document.body.append(h('div', { id: 'gone', style: 'grid-row: 1 / -1' }, h('div', {}, h('b', { text: 'Opening shared track…' }))));
  let data;
  try {
    const r = await fetch('https://api.github.com/gists/' + id, { headers: { Accept: 'application/vnd.github+json' }, cache: 'no-store' });
    if (r.status === 404) { gone('This link has been removed', 'The person who shared it has stopped sharing.'); return; }
    if (r.status === 403 || r.status === 429) { gone('Too many views right now', 'GitHub limits how often a network can open shared links. Try again in an hour.'); return; }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const g = await r.json(), f = g.files && g.files[SHARE_FILE]; if (!f) { gone('This link is not a GPX Workshop share', ''); return; }
    data = JSON.parse(f.truncated ? await (await fetch(f.raw_url)).text() : f.content);
  } catch { gone("Couldn't load the shared track", 'Check your internet connection and reload the page.'); return; }
  if (data.expires && Date.now() > data.expires) { gone('This link has expired', 'It was shared until ' + fmtDay(data.expires) + '. Ask for a new link.'); return; }
  document.title = data.title; document.body.innerHTML = viewerBody(data.title, viewerNote(data), data.expires ? 'Link works until ' + fmtDay(data.expires) : 'Shared from GPX Workshop');
  gpxViewerMain(data);
}

// Google Earth export (KML / KMZ) and the 3D view.

// ---------- KML / KMZ ----------
function kmlColor(hex, opacity) {   // #rrggbb -> aabbggrr
  const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex || '') || [0, 'ff', '2d', '55'];
  const a = Math.round(clamp(opacity == null ? 1 : opacity, 0, 1) * 255).toString(16).padStart(2, '0');
  return (a + m[3] + m[2] + m[1]).toLowerCase();
}
function toKml(files, docName) {
  const out = ['<?xml version="1.0" encoding="UTF-8"?>', '<kml xmlns="http://www.opengis.net/kml/2.2">', '<Document>', `<name>${xmlEsc(docName)}</name>`,
    '<Style id="wpt"><IconStyle><scale>1.1</scale><Icon><href>http://maps.google.com/mapfiles/kml/paddle/ylw-circle.png</href></Icon></IconStyle></Style>'];
  files.forEach((f, i) => {
    out.push(`<Style id="t${i}"><LineStyle><color>${kmlColor(f.color, f.opacity)}</color><width>${Math.max(2, f.width || 4)}</width></LineStyle></Style>`);
  });
  files.forEach((f, i) => {
    const st = stats(f);
    out.push('<Folder>', `<name>${xmlEsc(f.name)}</name>`, `<description>${xmlEsc(fmtDist(st.total) + (st.hasEle ? ` · climb ${Math.round(st.asc)} m · descent ${Math.round(st.desc)} m` : ''))}</description>`);
    f.segs.forEach((s, si) => {
      if (s.pts.length < 2) return;
      out.push('<Placemark>', `<name>${xmlEsc(f.segs.length > 1 ? (s.name && s.name !== f.name ? s.name : 'Segment ' + (si + 1)) : f.name)}</name>`, `<styleUrl>#t${i}</styleUrl>`,
        '<LineString><tessellate>1</tessellate><altitudeMode>clampToGround</altitudeMode><coordinates>',
        s.pts.map(p => `${+p[1].toFixed(7)},${+p[0].toFixed(7)}${p[2] != null ? ',' + (+p[2].toFixed(1)) : ''}`).join(' '),
        '</coordinates></LineString>', '</Placemark>');
    });
    for (const w of f.wpts) out.push('<Placemark>', `<name>${xmlEsc(w.name || 'Waypoint')}</name>`, w.desc ? `<description>${xmlEsc(w.desc)}</description>` : '', '<styleUrl>#wpt</styleUrl>', `<Point><coordinates>${+w.lon.toFixed(7)},${+w.lat.toFixed(7)}</coordinates></Point>`, '</Placemark>');
    out.push('</Folder>');
  });
  out.push('</Document>', '</kml>', ''); return out.join('\n');
}
function exportEarth(files, kmz) {
  files = files.filter(f => f.segs.some(s => s.pts.length) || f.wpts.length); if (!files.length) return;
  const name = files.length === 1 ? files[0].name : (files[0].folder && files.every(f => f.folder === files[0].folder) ? fleaf(files[0].folder) : 'GPX tracks');
  const kml = toKml(files, name), base = safeName(name);
  if (kmz) download(zipFiles([{ name: 'doc.kml', text: kml }]), base + '.kmz');
  else download(new Blob([kml], { type: 'application/vnd.google-earth.kml+xml' }), base + '.kml');
  toast(`Saved ${base}.${kmz ? 'kmz' : 'kml'}. Open it in Google Earth (on the web: Projects → New project → Import KML file).`);
}

else document.getElementById('app').innerHTML = '<p style="padding:24px;max-width:60ch">GPX Workshop needs an internet connection the first time it opens, to load its map library and map tiles. Connect and reload the page.</p>';

</script>
</body>
